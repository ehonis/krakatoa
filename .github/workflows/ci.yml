name: CI

on:
  pull_request:
  push:
    branches: [main]

# The private repo runs on the owner's own runner (label `box`); the public copy
# keeps GitHub's hosted runner. A new push to a PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ${{ github.event.repository.private && 'box' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # npm test lints, then runs the app and most server tests.
      - run: npm test
      - run: node ../server/nutritionix.test.js
      - run: npm run build
